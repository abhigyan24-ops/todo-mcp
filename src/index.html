<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo v2</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  #todo-list { list-style: none; padding: 0; }
  #todo-list li { padding: 8px; border-bottom: 1px solid #ddd; display: flex; align-items: center; }
  #todo-list li.completed span { text-decoration: line-through; color: #888; }
  .btn { margin-left: auto; cursor: pointer; }
  .btn:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>Todo List</h1>
<input type="text" id="new-task-input" placeholder="Add new task" autocomplete="off"/>
<button id="add-btn">Add</button>
<ul id="todo-list"></ul>
<script src="./main.js"></script>
</body>
</html>
